name: Build & Release FM Radio APK

on:
  push:
    branches: [ "qcom" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK packages
      run: |
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Find generated APK
      id: find_apk
      run: |
        apk=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n1)
        if [ -z "$apk" ]; then
          echo "APK not found!"
          exit 1
        fi
        echo "apk=$apk" >> $GITHUB_OUTPUT
        echo "apk_name=$(basename "$apk")" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: "Release ${{ github.ref_name }}"
        draft: false
        prerelease: false

    - name: Upload APK to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.find_apk.outputs.apk }}
        asset_name: ${{ steps.find_apk.outputs.apk_name }}
        asset_content_type: application/vnd.android.package-archive
