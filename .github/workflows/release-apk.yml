name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --- 1. Checkout code ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 2. Java ---
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # --- 3. Dependencies ---
      - name: Install apt dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      # --- 4. Cache Gradle ---
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # --- 5. Build APK ---
      - name: Build APK (Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease -x lint
          else
            echo "::warning:: No gradlew found. This project is not a Gradle Android project."
            echo "::warning:: Skipping build step."
            exit 78
          fi

      # --- 6. Find APK ---
      - name: Find generated APK
        id: find_apk
        run: |
          apk=$(find . -type f -name '*.apk' | grep 'release' | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "APK not found."
            exit 1
          fi
          echo "apk=$apk" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $apk)" >> $GITHUB_OUTPUT

      # --- 7. Create Release ---
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      # --- 8. Upload APK ---
      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk }}
          asset_name: ${{ steps.find_apk.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive
