name: Build and release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install apt dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build APK (Gradle)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease -x lint
          else
            echo "No gradlew found. This workflow expects a Gradle Android project (gradlew + build.gradle)."
            echo "Repository appears to be AOSP-style (Android.mk). See the repo README or the workflow docs."
            exit 78
          fi

      - name: Find generated APK
        id: find_apk
        run: |
          apk=$(find . -type f -path '*/build/outputs/apk/*/release/*.apk' | head -n 1 || true)
          if [ -z "$apk" ]; then
            echo "APK not found in build outputs."
            exit 1
          fi
          apk_name=$(basename "$apk")
          echo "apk=$apk" >> $GITHUB_OUTPUT
          echo "apk_name=$apk_name" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_apk.outputs.apk }}
          asset_name: ${{ steps.find_apk.outputs.apk_name }}
          asset_content_type: application/vnd.android.package-archive
